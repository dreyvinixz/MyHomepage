name: Quality checks

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check required site assets
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s favicon.svg
          grep -q 'lang="pt-BR"' index.html
          grep -q 'prefers-reduced-motion' styles.css
